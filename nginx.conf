server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location ~* \.(?:woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* \.(?:css|js|webp|png|jpg|jpeg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Distinct campaign URLs share the maintained stage-one page.
    # The path selects its first-screen offer; all assets use root-relative URLs.
    location ~ ^/p/(arenda|vykup|taxi|kak-eto-rabotaet|avtomobili|usloviya|podbor-avto|otzyvy|kontakty)/?$ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Check only the public rating widget before hiding the local rating fallback.
    location = /rating-service-status {
        proxy_pass https://yandex.ru/sprav/widget/rating-badge/7720672617?type=rating;
        limit_except GET { deny all; }
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host yandex.ru;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
    }
}
