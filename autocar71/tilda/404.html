<style>
  :root{--y:#FFC800;--ink:#1A1A1A}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:grid;place-items:center;padding:48px 18px;
       background:var(--ink);color:#fff;text-align:center;
       font:16px/1.55 Inter,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
  .code{font-family:Montserrat,Inter,Arial,sans-serif;font-weight:800;letter-spacing:-.06em;

  p{color:#A7A7A7;max-width:520px;margin:0 auto 32px;font-size:16px}
  .actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  a.btn{background:var(--y);color:var(--ink);border-radius:999px;min-height:62px;padding:0 30px;
        display:inline-flex;align-items:center;gap:12px;font-weight:700;font-size:16px;text-decoration:none;
        transition:filter .2s,transform .2s}
  a.btn:hover{filter:brightness(.95);transform:translateY(-2px)}
  a.btn:active{transform:scale(.98)}
  a.link{color:#DDD;font-weight:700;font-size:16px;text-decoration:none;border-bottom:1px solid #565656;
         display:inline-flex;align-items:center;min-height:62px}
  .logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:34px;

</head>
