# /etc/nginx/sites-available/autocar71.conf
#
# Основной домен. Сам лендинг живёт в Tilda (домен подключается там же по инструкции
# Tilda), а на этом сервере крутится только обработчик заявок: POST /lead и GET /health.
# Если лендинг экспортирован и раздаётся статикой — раскомментировать блок `root`.

upstream autocar_lead {
    server 127.0.0.1:8080;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=lead_zone:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name autocar71.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }
    location / { return 301 https://autocar71.ru$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name autocar71.ru;

    ssl_certificate     /etc/letsencrypt/live/autocar71.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autocar71.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 128k;

    # --- Приём заявок ---
    location = /lead {
        limit_req zone=lead_zone burst=10 nodelay;

        proxy_pass http://autocar_lead;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SLA: ответ клиенту должен уйти быстрее 200 мс.
        proxy_connect_timeout 2s;
        proxy_send_timeout    5s;
        proxy_read_timeout    5s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://autocar_lead;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Статика лендинга, если он раздаётся с этого сервера ---
    # root /var/www/autocar71;
    # index index.html;
    #
    # location / {
    #     try_files $uri $uri/ =404;
    # }
    #
    # location ~* \.(webp|avif|jpg|jpeg|png|svg|woff2)$ {
    #     expires 365d;
    #     add_header Cache-Control "public, immutable";
    #     access_log off;
    # }
    #
    # error_page 404 /404.html;
    # location = /404.html { internal; }
}
