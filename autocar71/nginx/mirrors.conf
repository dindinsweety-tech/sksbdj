# /etc/nginx/sites-available/autocar71-mirrors.conf
#
# Склейка доменов-зеркал на основной домен.
# Ключевой момент: $is_args$args — без него UTM-метки теряются при редиректе
# и CPL перестаёт считаться. Встроенный редиректор Tilda для этой задачи
# не подходит: он рубит параметры.
#
# Проверка (должен быть ровно один 301 с полной query-строкой):
#   curl -sIL "http://avtocar71.ru/old/page?utm_source=yandex&utm_term=arenda" | grep -iE "^(HTTP|location)"

# --- HTTP: отдаём ACME-челлендж и уводим на HTTPS основного домена ---
server {
    listen 80;
    listen [::]:80;
    server_name avtocar71.ru www.avtocar71.ru
                xn--71-6kcaj2c1aso.xn--p1ai www.xn--71-6kcaj2c1aso.xn--p1ai;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://autocar71.ru/$is_args$args;
    }
}

# --- HTTPS: сертификат нужен на КАЖДОМ зеркале, иначе браузер покажет
#     предупреждение ещё до редиректа ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name avtocar71.ru www.avtocar71.ru
                xn--71-6kcaj2c1aso.xn--p1ai www.xn--71-6kcaj2c1aso.xn--p1ai;

    ssl_certificate     /etc/letsencrypt/live/avtocar71.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avtocar71.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # Все старые внутренние URL переклеиваются на главную нового сайта,
    # query-строка сохраняется безусловно.
    location / {
        return 301 https://autocar71.ru/$is_args$args;
    }
}

# --- www основного домена: тоже на голый домен, с сохранением пути и параметров ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.autocar71.ru;

    ssl_certificate     /etc/letsencrypt/live/autocar71.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autocar71.ru/privkey.pem;

    return 301 https://autocar71.ru$request_uri;
}
