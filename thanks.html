<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#111111">
  <title>Вы завершили подбор — Автокар71</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{min-height:100svh;background:#111;color:#fff;display:grid;place-items:center;padding:24px}
    .thanks-page{width:min(720px,100%);background:#1c1c1c;border:1px solid #333;border-radius:32px;padding:clamp(30px,7vw,64px);position:relative;overflow:hidden;box-shadow:0 30px 100px rgba(0,0,0,.35)}
    .thanks-page:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:#ffc800;right:-110px;top:-120px;filter:blur(2px)}
    .thanks-logo{display:flex;align-items:center;gap:12px;font-family:Montserrat,sans-serif;font-weight:800;margin-bottom:56px;position:relative}
    .thanks-logo img{width:50px;height:50px;border-radius:50%}.thanks-logo span span{color:#ffc800}
    .thanks-check{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:#ffc800;color:#111;font-size:2rem;font-weight:800;margin-bottom:26px}
    h1{font-size:clamp(2.45rem,8vw,5rem);margin:0 0 20px;max-width:600px}p{color:#b7b7b7;font-size:1.05rem;max-width:540px;margin-bottom:34px}
    .thanks-actions{display:flex;gap:12px;flex-wrap:wrap}.thanks-actions .button:last-child{background:#303030;color:#fff}
    @media(max-width:560px){.thanks-page{border-radius:24px}.thanks-logo{margin-bottom:42px}.thanks-actions{display:grid}.thanks-actions .button{width:100%}}
  </style>
</head>
<body>
  <main class="thanks-page">
    <a class="thanks-logo" href="./"><img src="assets/logo.webp" alt=""><span>Автокар<span>71</span></span></a>
    <div class="thanks-check" aria-hidden="true">✓</div>
    <h1>Вы завершили подбор</h1>
    <p>Это демонстрационная версия: контакты не отправлены и не сохранены. Чтобы обсудить автомобиль сейчас, позвоните нам.</p>
    <div class="thanks-actions"><a class="button button-large" href="./">Вернуться на сайт</a><a class="button button-large" href="tel:+79539708877">Позвонить сейчас</a></div>
  </main>
</body>
</html>
