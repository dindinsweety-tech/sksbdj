<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#111111">
  <title>Прототип проезда — Автокар71</title>
  <link rel="preload" href="assets/inter-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/montserrat-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="drive.css?v=1">
</head>
<body>
  <header class="drive-header"><a href="index.html">← Вернуться на сайт</a><span>Прототип движения</span></header>
  <main>
    <section class="drive-intro">
      <p>Автопарк в движении</p>
      <h1>Прокрутите страницу.<br><em>Вы управляете проездом.</em></h1>
    </section>
    <section class="drive-story" id="drive-story">
      <div class="drive-stage" id="drive-stage" data-quality="static">
        <div class="drive-layer drive-sky" aria-hidden="true"></div>
        <div class="drive-layer-stack drive-far" aria-hidden="true">
          <div class="drive-tile drive-sharp"></div><div class="drive-tile drive-medium"></div><div class="drive-tile drive-strong"></div>
        </div>
        <div class="drive-layer-stack drive-near" aria-hidden="true">
          <div class="drive-tile drive-sharp"></div><div class="drive-tile drive-medium"></div><div class="drive-tile drive-strong"></div>
        </div>
        <div class="drive-vehicle" aria-hidden="true">
          <img class="drive-shadow" alt="">
          <div class="drive-car-wrap"><img class="drive-car drive-car-sharp" src="assets/hero-park.webp" alt=""><img class="drive-car drive-car-wheels" alt=""><span class="drive-shine"></span></div>
        </div>
        <div class="drive-copy" aria-live="polite">
          <p class="drive-kicker">Автомобиль <span id="drive-number">01</span></p>
          <h2 id="drive-model">Автокар71</h2>
          <p id="drive-specs">Автомобиль под вашу задачу</p>
          <strong id="drive-price">Аванс от 20%</strong>
        </div>
        <div class="drive-status" id="drive-status">Ожидаются подготовленные ассеты</div>
        <nav class="drive-controls" aria-label="Переключение автомобилей" hidden>
          <button type="button" id="drive-prev" aria-label="Предыдущий автомобиль">←</button>
          <button type="button" id="drive-next" aria-label="Следующий автомобиль">→</button>
        </nav>
      </div>
      <noscript><div class="drive-noscript"><img src="assets/hero-park.webp" alt="Автомобиль Автокар71"><p>Для управления сценой прокруткой включите JavaScript.</p></div></noscript>
    </section>
    <section class="drive-outro"><p>Сцена закончилась</p><h2>Дальше — выбор автомобиля.</h2><a href="index.html#fleet">Перейти в каталог →</a></section>
  </main>
  <script src="drive.js?v=1" defer></script>
</body>
</html>
